[build-system]
requires = ["setuptools>=77.0,<84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soul-engine-mcp"
version = "1.2.0"
authors = [
  { name="Azhonaras (Navid Badami)", email="nbada@users.noreply.github.com" },
  { name="Antigravity (UPI)", email="antigravity@google.com" },
]
description = "Epistemic Bio-Homeostatic Identity & Memory Kernel for AI Agents with Model Context Protocol (MCP) Interface"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "agent", "memory", "mcp", "epistemic", "neuromodulation", "homeostasis", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0,<1.20",
]

[project.scripts]
soul-mcp = "soul_mcp_server:main"
soul-install = "install:main"
soul-host = "soul_host:main"

[project.urls]
"Homepage" = "https://github.com/Azhonaras/soul-engine"
"Bug Tracker" = "https://github.com/Azhonaras/soul-engine/issues"

[tool.setuptools]
py-modules = ["soul_kernel", "soul_mcp_server", "soul_review", "install", "soul_host"]

[tool.setuptools.data-files]
"share/soul-engine/skills/soul-seal" = ["skills/soul-seal/SKILL.md"]
"share/soul-engine/skills/seacom" = ["skills/seacom/SKILL.md"]
"share/soul-engine/docs" = ["docs/CONSTITUTION.md"]
