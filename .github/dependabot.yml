version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"
    # Soul supports Python 3.9. setuptools 83+ and pytest 9+ do not.
    ignore:
      - dependency-name: "setuptools"
        versions: [">=83"]
      - dependency-name: "pytest"
        versions: [">=9"]
